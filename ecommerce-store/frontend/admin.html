<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Luxe Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--surface);
            padding: 2rem;
            border-radius: var(--radius);
            width: 100%;
            max-width: 500px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-brand">LUXE</a>
        <div class="nav-links">
            <a href="index.html">Products</a>
            <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
            
            <a href="orders.html" class="auth-only d-none">My Orders</a>
            <a href="admin.html" class="admin-only d-none" style="color: var(--primary);">Admin</a>
            <a href="#" class="btn btn-danger auth-only d-none logout-btn" style="color: white">Logout</a>
        </div>
    </nav>

    <main class="container page-transition-enter">
        <div class="flex justify-between items-center mb-4">
            <h1 style="font-size: 2rem; font-weight: 700;">Manage Products</h1>
            <button class="btn btn-primary" id="add-product-btn">+ Add Product</button>
        </div>
        
        <table class="cart-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="admin-products-body">
                <!-- Populated by JS -->
            </tbody>
        </table>
    </main>

    <!-- Product Modal -->
    <div id="product-modal" class="modal d-none">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom: 1.5rem;">Add Product</h2>
            <form id="product-form">
                <input type="hidden" id="prod-id">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="prod-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="prod-desc" class="form-control" rows="3"></textarea>
                </div>
                <div class="flex" style="gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label>Price ($)</label>
                        <input type="number" id="prod-price" class="form-control" step="0.01" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Stock</label>
                        <input type="number" id="prod-stock" class="form-control" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="prod-category" class="form-control">
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" id="prod-image" class="form-control">
                </div>
                <div class="flex justify-between mt-4">
                    <button type="button" class="btn" id="close-modal" style="background: var(--border);">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
