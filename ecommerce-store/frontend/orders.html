<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Luxe Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .order-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        .order-item-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-brand">LUXE</a>
        <div class="nav-links">
            <a href="index.html">Products</a>
            <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
            
            <a href="orders.html" class="auth-only d-none" style="color: var(--primary);">My Orders</a>
            <a href="admin.html" class="admin-only d-none">Admin</a>
            <a href="#" class="btn btn-danger auth-only d-none logout-btn" style="color: white">Logout</a>
        </div>
    </nav>

    <main class="container page-transition-enter">
        <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 2rem;">My Orders</h1>
        
        <div id="orders-container">
            <!-- Populated by JS -->
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/orders.js"></script>
</body>
</html>
