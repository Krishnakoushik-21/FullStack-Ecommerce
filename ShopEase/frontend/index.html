<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ShopEase</title>
    <meta name="theme-color" content="#2563EB">
    <link rel="manifest" href="manifest.json">
    
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Razorpay Checkout SDK (loaded once for the SPA) -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="css/home.css">
    <script>
        if (localStorage.getItem('shopease_dark_mode') === 'true') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>
</head>
<body>

    <div id="app-container">
        <!-- Desktop Top Navigation Bar -->
        <nav class="desktop-nav" id="desktop-nav">
            <div class="nav-center">
                <!-- Logo -->
                <span class="nav-logo" onclick="app.navigate('home')">ShopEase</span>

                <!-- Nav Links -->
                <div class="nav-links">
                    <button class="nav-link active" id="nav-home" onclick="app.navigate('home')">
                        <i class="material-icons">home</i> Home
                    </button>
                    <button class="nav-link" id="nav-categories" onclick="app.navigate('categories')">
                        <i class="material-icons">grid_view</i> Categories
                    </button>
                </div>

                <!-- Search Bar -->
                <div class="nav-search-bar">
                    <i class="material-icons nav-search-icon">search</i>
                    <input type="search" id="nav-search-input" placeholder="Search products, brands, categories..." 
                        onkeydown="if(event.key==='Enter') handleSearch(this.value)">
                </div>

                <!-- Action Buttons -->
                <div class="nav-actions">
                    <button class="nav-action-btn" id="nav-wishlist" onclick="app.navigate('wishlist')" title="Wishlist">
                        <i class="material-icons">favorite_border</i>
                    </button>
                    <button class="nav-action-btn" id="nav-cart" onclick="app.navigate('cart')" title="Cart">
                        <i class="material-icons">shopping_cart</i>
                        <span class="nav-badge" id="nav-cart-badge" style="display:none;">0</span>
                    </button>
                    <button class="nav-action-btn" id="nav-orders" onclick="app.navigate('orders')" title="My Orders">
                        <i class="material-icons">receipt_long</i>
                    </button>
                    <button class="nav-action-btn" id="nav-profile" onclick="app.navigate('profile')" title="Profile">
                        <i class="material-icons">account_circle</i>
                    </button>
                    <button class="nav-btn-login" id="nav-settings-btn" onclick="app.navigate('settings')">⚙ Settings</button>
                </div>
            </div>
        </nav>

        <!-- Dynamic Views -->
        <div id="view-splash" class="view no-nav flex-view"></div>
        <div id="view-login" class="view no-nav"></div>
        <div id="view-register" class="view no-nav"></div>
        <div id="view-home" class="view"></div>
        <div id="view-categories" class="view"></div>
        <div id="view-product" class="view"></div>
        <div id="view-wishlist" class="view"></div>
        <div id="view-cart" class="view"></div>
        <div id="view-checkout" class="view"></div>
        <div id="view-payment" class="view"></div>
        <div id="view-order-success" class="view"></div>
        <div id="view-orders" class="view"></div>
        <div id="view-profile" class="view"></div>
        <div id="view-settings" class="view"></div>

        <!-- Hidden mobile bottom-nav (kept for JS compatibility) -->
        <nav class="bottom-nav" id="bottom-nav" style="display:none !important;"></nav>
    </div>


    <!-- JS Core -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/home.js"></script>
    <script src="js/categories.js"></script>
    <script src="js/product.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/checkout.js"></script>
    <script src="js/payment.js"></script>
    <script src="js/order-success.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
