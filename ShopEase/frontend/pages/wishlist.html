<!-- Wishlist View -->
<div class="top-app-bar" style="position: sticky; top: 0; z-index: 100; border-radius: 0;">
    <span style="font-weight: 700; font-size: 18px; color: var(--md-sys-color-on-surface); margin-left: 16px;">My Wishlist</span>
</div>

<div class="wishlist-page-container" style="padding-bottom: 72px;">
    <!-- Wishlist empty state -->
    <div id="wishlist-empty-state" style="display: none; flex-direction: column; align-items: center; justify-content: center; padding: 64px 16px; text-align: center;">
        <i class="material-icons" style="font-size: 80px; color: var(--md-sys-color-outline); margin-bottom: 16px;">favorite_border</i>
        <h3 style="font-size: 18px; font-weight: 700; color: var(--md-sys-color-on-surface);">Your wishlist is empty</h3>
        <p style="font-size: 13px; color: var(--md-sys-color-on-surface-variant); margin-top: 6px; max-width: 280px;">Save your favorite items here to track them or purchase later!</p>
        <button class="btn btn-filled" onclick="app.navigate('home')" style="margin-top: 20px; border-radius: 20px; padding: 10px 24px;">Explore Products</button>
    </div>

    <!-- Wishlist items container -->
    <div id="wishlist-items-container" style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">
        <!-- Loaded dynamically -->
    </div>
</div>
